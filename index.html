<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>朝平农业 - 后台管理</title>
<script src="https://static.cloudbase.net/cloudbase-js-sdk/latest/cloudbase.full.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; background:#f3f7f0; color:#17351f; }

/* Login */
.login-overlay {
  position:fixed; top:0; left:0; right:0; bottom:0; z-index:999;
  background:#f3f7f0; display:flex; align-items:center; justify-content:center;
}
.login-card {
  width:420px; padding:48px 36px; border-radius:24px; background:#fff;
  box-shadow:0 12px 40px rgba(31,122,57,0.12); text-align:center;
}
.login-card h1 { font-size:28px; margin-bottom:8px; color:#1f7a39; }
.login-card .sub { color:#708070; font-size:14px; margin-bottom:32px; }
.login-card label { display:block; text-align:left; margin-bottom:6px; font-size:14px; font-weight:600; color:#333; }
.login-card input {
  width:100%; height:44px; padding:0 14px; border:2px solid #e0e8e0; border-radius:12px;
  font-size:14px; margin-bottom:18px; outline:none; background:#f9fbf9;
}
.login-card input:focus { border-color:#2f8a42; }
.login-card .btn {
  width:100%; height:46px; border:none; border-radius:12px; background:linear-gradient(135deg,#1f7a39,#2f8a42);
  color:#fff; font-size:16px; font-weight:600; cursor:pointer;
}
.login-card .btn:hover { opacity:0.92; }
.login-card .hint { margin-top:16px; font-size:12px; color:#a0b0a0; line-height:1.6; }
.login-card .error { color:#d32f2f; font-size:13px; margin-top:8px; }

/* Layout */
.app { display:none; height:100vh; flex-direction:column; }
.app.show { display:flex; }
.login-overlay.hide { display:none; }

/* Top bar */
.topbar {
  display:flex; align-items:center; justify-content:space-between;
  padding:0 24px; height:56px; background:linear-gradient(135deg,#1f7a39,#61b15a); color:#fff;
  flex-shrink:0;
}
.topbar h2 { font-size:18px; }
.topbar .logout-btn { padding:6px 16px; border:1px solid rgba(255,255,255,0.6); border-radius:20px; background:transparent; color:#fff; font-size:13px; cursor:pointer; }
.topbar .logout-btn:hover { background:rgba(255,255,255,0.15); }

/* Main */
.main { display:flex; flex:1; overflow:hidden; }

/* Sidebar */
.sidebar {
  width:200px; background:#fff; border-right:1px solid #e8efe8;
  display:flex; flex-direction:column; flex-shrink:0;
}
.sidebar-nav { display:flex; border-bottom:1px solid #e8efe8; }
.sidebar-nav .nav-item {
  flex:1; text-align:center; padding:16px 0; font-size:14px; cursor:pointer;
  border-bottom:3px solid transparent; color:#708070; font-weight:600;
}
.sidebar-nav .nav-item.active { color:#2f8a42; border-bottom-color:#2f8a42; }
.sidebar-list { flex:1; overflow-y:auto; padding:8px 0; }
.sidebar-item {
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 20px; cursor:pointer; font-size:14px; color:#536453;
  border-left:4px solid transparent; transition:all 0.15s;
}
.sidebar-item:hover { background:#f6faf6; }
.sidebar-item.active { background:#f3f7f0; color:#2f8a42; font-weight:700; border-left-color:#2f8a42; }
.sidebar-item .count { font-size:12px; color:#999; }
.sidebar-add {
  margin:8px 16px 16px; padding:10px 0; border:2px dashed #c8dcc8; border-radius:12px;
  background:transparent; color:#2f8a42; font-size:13px; cursor:pointer; text-align:center; width:calc(100% - 32px);
}
.sidebar-add:hover { background:#f0f7f0; }

/* Content */
.content { flex:1; overflow-y:auto; padding:20px 24px; }
.content-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
.content-header h3 { font-size:20px; }
.content-header .add-btn {
  padding:10px 22px; border:none; border-radius:20px; background:#2f8a42;
  color:#fff; font-size:14px; font-weight:600; cursor:pointer;
}
.content-header .add-btn:hover { opacity:0.9; }
.content-header .header-actions { display:flex; gap:10px; align-items:center; }
.content-header .secondary-btn {
  padding:10px 18px; border:1px solid #dce9dd; border-radius:20px; background:#fff;
  color:#536453; font-size:13px; font-weight:600; cursor:pointer;
}
.content-header .secondary-btn:hover { background:#f6faf6; }
.product-content-header { flex-wrap:wrap; gap:14px; align-items:flex-start; }
.product-header-main { flex:1; min-width:280px; }
.product-header-main h3 { margin-bottom:12px; }
.product-search-box {
  display:flex; align-items:center; gap:8px; padding:8px 12px;
  border:1px solid #dce9dd; border-radius:14px; background:#fff;
}
.product-search-icon { color:#708070; font-size:13px; font-weight:700; flex-shrink:0; }
.product-search-input {
  flex:1; min-width:0; border:none; outline:none; background:transparent;
  font-size:14px; color:#17351f;
}
.product-search-input::placeholder { color:#a0b0a0; }
.search-btn, .clear-btn {
  border:none; background:transparent; font-size:13px; font-weight:600; cursor:pointer; flex-shrink:0;
}
.search-btn { color:#2f8a42; }
.clear-btn { color:#708070; }
.load-sentinel { height:1px; }
.load-status { text-align:center; color:#708070; font-size:13px; padding:16px 0 8px; }

/* Product cards */
.product-grid { display:flex; flex-direction:column; gap:12px; }
.product-card {
  display:flex; gap:16px; padding:20px; border-radius:16px; background:#fff;
  box-shadow:0 4px 16px rgba(34,96,51,0.06);
}
.product-icon {
  display:flex; align-items:center; justify-content:center;
  width:64px; height:64px; border-radius:18px; background:#e5f3e7;
  color:#2f8a42; font-size:26px; font-weight:700; flex-shrink:0;
}
.product-thumb {
  width:80px; height:80px; border-radius:18px; object-fit:contain;
  background:#ffffff; border:1px solid #edf2ed; flex-shrink:0;
}
.product-info { flex:1; min-width:0; }
.product-info .name { font-size:17px; font-weight:700; }
.product-info .ingredient { color:#536453; font-size:13px; margin-top:4px; }
.product-info .ingredient .ingredient-separator { margin:0 6px; color:#17351f; font-weight:800; }
.product-info .meta { color:#708070; font-size:12px; margin-top:4px; }
.product-info .spec { color:#8a6a2a; font-size:12px; margin-top:4px; padding-top:4px; border-top:1px solid #edf2ed; }
.product-actions { display:flex; flex-direction:column; gap:8px; flex-shrink:0; }
.product-actions button {
  padding:6px 16px; border:1px solid #dce9dd; border-radius:14px;
  background:#fff; font-size:12px; cursor:pointer;
}
.product-actions .edit-btn { color:#2f8a42; border-color:#bfe4c7; }
.product-actions .edit-btn:hover { background:#eef8ef; }
.product-actions .del-btn { color:#d32f2f; border-color:#fce4e4; }
.product-actions .del-btn:hover { background:#fef5f5; }
.status-badge { display:inline-block; padding:2px 10px; border-radius:10px; font-size:11px; }
.status-badge.active { background:#e5f3e7; color:#2f8a42; }
.status-badge.inactive { background:#f5f5f5; color:#999; }
.status-badge.deleted { background:#fce4e4; color:#d32f2f; }

/* Category list (in content area) */
.cat-list { display:flex; flex-direction:column; gap:10px; }
.cat-card {
  display:flex; align-items:center; justify-content:space-between;
  padding:18px 20px; border-radius:14px; background:#fff;
  box-shadow:0 2px 10px rgba(34,96,51,0.04);
}
.cat-card .cat-info .cat-name { font-size:16px; font-weight:600; }
.cat-card .cat-info .cat-meta { font-size:12px; color:#708070; margin-top:2px; }
.cat-card .edit-btn { padding:6px 16px; border:1px solid #bfe4c7; border-radius:14px; background:#fff; color:#2f8a42; cursor:pointer; font-size:12px; }
.cat-card .cat-actions { display:flex; gap:8px; flex-shrink:0; }
.cat-card .del-btn { padding:6px 16px; border:1px solid #fce4e4; border-radius:14px; background:#fff; color:#d32f2f; cursor:pointer; font-size:12px; }
.cat-card .del-btn:hover { background:#fef5f5; }
.cat-icon-thumb {
  width:34px; height:34px; border-radius:10px; object-fit:contain;
  background:#ffffff; border:1px solid #edf2ed; vertical-align:middle; margin-right:8px;
}

/* Banner management */
.banner-upload-card {
  display:flex; align-items:center; justify-content:space-between; gap:18px;
  margin-bottom:18px; padding:18px 20px; border:2px dashed #c8dcc8;
  border-radius:18px; background:#fff;
}
.banner-upload-card input { flex:1; }
.banner-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:16px; }
.banner-card {
  padding:16px; border-radius:18px; background:#fff;
  box-shadow:0 4px 16px rgba(34,96,51,0.06);
}
.banner-preview {
  display:flex; align-items:center; justify-content:center;
  width:100%; height:150px; border-radius:14px; background:#ffffff;
  color:#2f8a42; font-weight:700; overflow:hidden; border:1px solid #edf2ed;
}
.banner-preview img { width:100%; height:100%; object-fit:contain; background:#ffffff; }
.banner-meta { margin-top:12px; color:#708070; font-size:12px; line-height:1.7; word-break:break-all; }
.banner-actions { display:flex; justify-content:flex-end; margin-top:12px; }
.banner-actions .del-btn {
  padding:7px 16px; border:1px solid #fce4e4; border-radius:14px;
  background:#fff; color:#d32f2f; cursor:pointer; font-size:12px;
}
.banner-actions .del-btn:hover { background:#fef5f5; }

/* Hot solution management */
.solution-grid { display:flex; flex-direction:column; gap:12px; }
.solution-card {
  display:flex; gap:16px; padding:20px; border-radius:16px; background:#fff;
  box-shadow:0 4px 16px rgba(34,96,51,0.06);
}
.solution-thumb {
  display:flex; align-items:center; justify-content:center;
  width:96px; height:96px; border-radius:18px; background:#ffffff;
  color:#c77a12; font-size:28px; font-weight:700; border:1px solid #edf2ed;
  overflow:hidden; flex-shrink:0;
}
.solution-thumb img { width:100%; height:100%; object-fit:contain; background:#ffffff; }
.solution-info { flex:1; min-width:0; }
.solution-info .name { font-size:17px; font-weight:700; }
.solution-info .meta { color:#708070; font-size:12px; margin-top:4px; }
.solution-info .features { color:#536453; font-size:13px; margin-top:6px; white-space:pre-line; line-height:1.5; }
.solution-actions { display:flex; flex-direction:column; gap:8px; flex-shrink:0; }
.solution-actions button {
  padding:6px 16px; border:1px solid #dce9dd; border-radius:14px;
  background:#fff; font-size:12px; cursor:pointer;
}
.solution-actions .edit-btn { color:#2f8a42; border-color:#bfe4c7; }
.solution-actions .del-btn { color:#d32f2f; border-color:#fce4e4; }
.solution-product-row {
  display:grid; grid-template-columns:32px 1fr 0.8fr 1fr 28px; gap:8px; align-items:center; margin-bottom:8px;
  padding:6px; border:1px solid transparent; border-radius:12px;
}
.solution-product-row input { margin:0; }
.solution-product-row.dragging { opacity:0.55; border-color:#bfe4c7; background:#f0f7f0; }
.solution-product-row.drag-target { border-color:#2f8a42; background:#f6faf6; }
.solution-product-drag-handle {
  width:28px; height:32px; border:1px solid #dce9dd; border-radius:10px;
  background:#fff; color:#708070; cursor:grab; font-size:16px; line-height:1;
}
.solution-product-drag-handle:active { cursor:grabbing; }

/* Modal */
.modal-mask {
  display:none; position:fixed; top:0; left:0; right:0; bottom:0; z-index:100;
  background:rgba(0,0,0,0.4); align-items:center; justify-content:center;
}
.modal-mask.show { display:flex; }
.modal-box {
  width:600px; max-height:80vh; background:#fff; border-radius:20px;
  display:flex; flex-direction:column; box-shadow:0 20px 60px rgba(0,0,0,0.2);
}
.modal-box h3 { padding:24px 28px 16px; font-size:20px; border-bottom:1px solid #edf2ed; }
.modal-body { padding:20px 28px; overflow-y:auto; flex:1; }
.modal-body .field { margin-bottom:18px; }
.modal-body .field label { display:block; font-size:13px; font-weight:600; margin-bottom:6px; color:#333; }
.modal-body .field input, .modal-body .field textarea, .modal-body .field select {
  width:100%; padding:10px 14px; border:2px solid #e0e8e0; border-radius:10px;
  font-size:14px; outline:none; background:#f9fbf9; font-family:inherit;
}
.modal-body .field input:focus, .modal-body .field textarea:focus, .modal-body .field select:focus { border-color:#2f8a42; }
.modal-body .field textarea { min-height:80px; resize:vertical; }
.modal-body .row { display:flex; gap:12px; }
.modal-body .row .field { flex:1; }
.modal-body .dynamic-row { display:flex; gap:8px; align-items:center; margin-bottom:8px; }
.modal-body .dynamic-row input,
.modal-body .dynamic-row textarea { flex:1; }
.modal-body .dynamic-row .rm-btn {
  width:28px; height:28px; border:none; border-radius:50%; background:#fce4e4; color:#d32f2f;
  cursor:pointer; font-size:14px; line-height:28px; text-align:center; flex-shrink:0;
}
.image-upload-card {
  display:flex; gap:16px; align-items:center; padding:14px; border:2px dashed #c8dcc8;
  border-radius:14px; background:#f9fbf9;
}
.image-preview {
  display:flex; align-items:center; justify-content:center;
  width:96px; height:96px; border-radius:16px; background:#e5f3e7; color:#2f8a42;
  font-size:32px; font-weight:700; overflow:hidden; flex-shrink:0;
}
.image-preview img { width:100%; height:100%; object-fit:contain; background:#ffffff; }
.image-upload-actions { flex:1; min-width:0; }
.image-upload-actions input { margin:0 0 8px; }
.image-upload-hint { color:#708070; font-size:12px; line-height:1.5; }
.product-image-manager {
  display:grid; grid-template-columns:repeat(auto-fill, minmax(118px, 1fr)); gap:12px;
  margin-top:12px;
}
.product-image-item {
  position:relative; padding:8px; border:1px solid #edf2ed; border-radius:14px;
  background:#fff;
}
.product-image-item.main { border-color:#2f8a42; box-shadow:0 0 0 2px rgba(47,138,66,0.08); }
.product-image-item-preview {
  display:flex; align-items:center; justify-content:center; width:100%; height:92px;
  border-radius:10px; background:#ffffff; color:#2f8a42; font-weight:700; overflow:hidden;
}
.product-image-item-preview img { width:100%; height:100%; object-fit:contain; background:#ffffff; }
.product-image-badge {
  position:absolute; top:12px; left:12px; padding:2px 7px; border-radius:999px;
  background:#2f8a42; color:#fff; font-size:11px; font-weight:700;
}
.product-image-item-actions { display:flex; flex-wrap:wrap; gap:5px; margin-top:8px; }
.product-image-item-actions button {
  flex:1 0 auto; min-width:44px; padding:4px 6px; border:1px solid #dce9dd;
  border-radius:8px; background:#fff; color:#536453; font-size:11px; cursor:pointer;
}
.product-image-item-actions .danger { color:#d32f2f; border-color:#fce4e4; }
.product-image-empty {
  padding:14px; border:1px dashed #c8dcc8; border-radius:12px; color:#708070;
  font-size:12px; text-align:center; background:#f9fbf9;
}
.category-checkbox-grid {
  display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:10px;
}
.category-checkbox {
  display:flex; align-items:center; gap:8px; padding:10px 12px; border:1px solid #dce9dd;
  border-radius:10px; background:#f9fbf9; color:#536453; font-size:13px;
}
.category-checkbox input[type="checkbox"] {
  width:16px !important; height:16px; margin:0; padding:0 !important; border:none;
  flex:0 0 auto;
}
.modal-body .add-row-btn { padding:8px 0; border:2px dashed #c8dcc8; border-radius:10px; background:transparent; color:#2f8a42; cursor:pointer; width:100%; font-size:13px; }
.modal-body .add-row-btn:hover { background:#f0f7f0; }
.modal-footer { padding:16px 28px 24px; display:flex; gap:12px; justify-content:flex-end; border-top:1px solid #edf2ed; }
.modal-footer button { padding:10px 28px; border-radius:12px; font-size:14px; font-weight:600; cursor:pointer; }
.modal-footer .cancel-btn { border:1px solid #dce9dd; background:#fff; color:#708070; }
.modal-footer .save-btn { border:none; background:#2f8a42; color:#fff; }
.modal-footer .save-btn:hover { opacity:0.9; }

/* Toast */
.toast { display:none; position:fixed; top:80px; left:50%; transform:translateX(-50%); z-index:200; padding:12px 28px; border-radius:20px; background:#333; color:#fff; font-size:14px; }
.toast.show { display:block; animation:fadeInOut 2s forwards; }
@keyframes fadeInOut { 0%{opacity:0} 15%{opacity:1} 70%{opacity:1} 100%{opacity:0} }

.empty { text-align:center; padding:80px 20px; color:#708070; font-size:15px; }
.loading { text-align:center; padding:60px 20px; color:#708070; font-size:14px; }
</style>
</head>
<body>

<!-- Login -->
<div id="loginOverlay" class="login-overlay">
  <div class="login-card">
    <h1>🌾 朝平农业后台</h1>
    <div class="sub">产品与分类数据管理</div>
    <label>云环境 ID</label>
    <input type="text" id="envIdInput" placeholder="输入云环境ID，如 cloud-xxx">
    <label>用户名</label>
    <input type="text" id="usernameInput" placeholder="请输入用户名">
    <label>密码</label>
    <input type="password" id="passwordInput" placeholder="请输入密码">
    <button class="btn" onclick="doLogin()">登录</button>
    <div class="error" id="loginError"></div>
  </div>
</div>

<!-- App -->
<div id="app" class="app">
  <div class="topbar">
    <h2>🌾 后台管理</h2>
    <div>
      <span style="font-size:13px;opacity:0.85;margin-right:12px;" id="envDisplay"></span>
      <button class="logout-btn" onclick="doLogout()">退出</button>
    </div>
  </div>
  <div class="main">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="sidebar-nav">
        <div class="nav-item active" data-tab="products" onclick="switchTab('products')">产品</div>
        <div class="nav-item" data-tab="categories" onclick="switchTab('categories')">分类</div>
        <div class="nav-item" data-tab="diseases" onclick="switchTab('diseases')">病害</div>
        <div class="nav-item" data-tab="banners" onclick="switchTab('banners')">轮播</div>
        <div class="nav-item" data-tab="solutions" onclick="switchTab('solutions')">方案</div>
      </div>
      <!-- Product sidebar: category filter -->
      <div id="productSidebar" class="sidebar-list"></div>
      <div id="categorySidebar" class="sidebar-list" style="display:none;"></div>
      <div id="diseaseSidebar" class="sidebar-list" style="display:none;"></div>
      <div id="bannerSidebar" class="sidebar-list" style="display:none;"></div>
      <div id="solutionSidebar" class="sidebar-list" style="display:none;"></div>
      <button id="sidebarAddBtn" class="sidebar-add" onclick="onSidebarAdd()">+ 添加</button>
    </div>
    <!-- Content -->
    <div class="content" id="contentArea"></div>
  </div>
</div>

<!-- Toast -->
<div id="toast" class="toast"></div>

<!-- Product Form Modal -->
<div id="productModal" class="modal-mask" onclick="closeModal('productModal')">
  <div class="modal-box" onclick="event.stopPropagation()">
    <h3 id="productModalTitle">添加产品</h3>
    <div class="modal-body" id="productModalBody"></div>
    <div class="modal-footer">
      <button class="cancel-btn" onclick="closeModal('productModal')">取消</button>
      <button class="save-btn" id="productSaveBtn" onclick="saveProduct()">保存</button>
    </div>
  </div>
</div>

<!-- Category Form Modal -->
<div id="categoryModal" class="modal-mask" onclick="closeModal('categoryModal')">
  <div class="modal-box" onclick="event.stopPropagation()">
    <h3 id="categoryModalTitle">添加分类</h3>
    <div class="modal-body" id="categoryModalBody"></div>
    <div class="modal-footer">
      <button class="cancel-btn" onclick="closeModal('categoryModal')">取消</button>
      <button class="save-btn" id="categorySaveBtn" onclick="saveCategory()">保存</button>
    </div>
  </div>
</div>

<!-- Disease Category Form Modal -->
<div id="diseaseModal" class="modal-mask" onclick="closeModal('diseaseModal')">
  <div class="modal-box" onclick="event.stopPropagation()">
    <h3 id="diseaseModalTitle">添加病害分类</h3>
    <div class="modal-body" id="diseaseModalBody"></div>
    <div class="modal-footer">
      <button class="cancel-btn" onclick="closeModal('diseaseModal')">取消</button>
      <button class="save-btn" id="diseaseSaveBtn" onclick="saveDiseaseCategory()">保存</button>
    </div>
  </div>
</div>

<!-- Hot Solution Form Modal -->
<div id="solutionModal" class="modal-mask" onclick="closeModal('solutionModal')">
  <div class="modal-box" onclick="event.stopPropagation()">
    <h3 id="solutionModalTitle">添加热门方案</h3>
    <div class="modal-body" id="solutionModalBody"></div>
    <div class="modal-footer">
      <button class="cancel-btn" onclick="closeModal('solutionModal')">取消</button>
      <button class="save-btn" id="solutionSaveBtn" onclick="saveHotSolution()">保存</button>
    </div>
  </div>
</div>

<script>
// ===== State =====
let app = null;
let envId = '';
let uid = '';
let activeTab = 'products';
let activeCategory = '全部';
let products = [];
let productKeyword = '';
let productSearchedKeyword = '';
let productPage = 1;
let productPageSize = 20;
let productTotal = 0;
let productHasMore = false;
let productLoading = false;

// Restore saved config

const savedUsername = localStorage.getItem('cp_username');

async function restoreCurrentUid() {
  const user = await app.auth().getCurrentUser();
  uid = user && user.uid ? user.uid : '';
  return uid;
}

async function ensureUid() {
  if (uid) return uid;
  const restoredUid = await restoreCurrentUid();
  if (!restoredUid) throw new Error('登录状态已失效，请重新登录');
  return restoredUid;
}

async function callAdminFunction(data) {
  const clientUid = await ensureUid();
  const resp = await app.callFunction({
    name: 'quickstartFunctions',
    data: { ...data, clientUid }
  });
  const result = resp.result || {};
  if (!result.success) {
    throw new Error(result.errMsg || '操作失败');
  }
  return result.data;
}

function fileIdToCdnUrl(fileID) {
  const id = String(fileID || '');
  if (!id.startsWith('cloud://')) return '';
  const rest = id.slice('cloud://'.length);
  const slashIndex = rest.indexOf('/');
  if (slashIndex <= 0) return '';
  const storageId = rest.slice(0, slashIndex).split('.')[1] || rest.slice(0, slashIndex).split('.')[0];
  const cloudPath = rest.slice(slashIndex + 1);
  if (!storageId || !cloudPath) return '';
  return `https://${storageId}.tcb.qcloud.la/${cloudPath}`;
}

function getTempFileURLs(fileList) {
  return (fileList || []).filter(Boolean).map(fileIdToCdnUrl);
}

// 自动恢复登录状态
if (savedEnvId) {
  (async () => {
    try {
      app = cloudbase.init({ env: savedEnvId });
      const loginState = await app.auth({ persistence: 'local' }).getLoginState();
      if (loginState && loginState.user) {
        envId = savedEnvId;
        uid = loginState.user.uid || await restoreCurrentUid();
        console.log('restored uid:', uid);
        document.getElementById('loginOverlay').classList.add('hide');
        document.getElementById('app').classList.add('show');
        document.getElementById('envDisplay').textContent = '环境: ' + envId;
        await loadAll();
      }
    } catch (_) {
      // 未登录，停留在登录页
    }
  })();
}

// ===== Login =====
async function doLogin() {
  const envInput = document.getElementById('envIdInput').value.trim();
  const username = document.getElementById('usernameInput').value.trim();
  const password = document.getElementById('passwordInput').value.trim();
  const errEl = document.getElementById('loginError');
  errEl.textContent = '';

  if (!envInput) { errEl.textContent = '请输入云环境ID'; return; }
  if (!username) { errEl.textContent = '请输入用户名'; return; }
  if (!password) { errEl.textContent = '请输入密码'; return; }

  try {
    app = cloudbase.init({ env: envInput });
    await app.auth({ persistence: 'local' }).signInWithUsernameAndPassword(username, password);

    // 获取用户 UID
    await restoreCurrentUid();
    console.log('login uid:', uid);

    envId = envInput;
    localStorage.setItem('cp_envId', envId);
    localStorage.setItem('cp_username', username);

    document.getElementById('loginOverlay').classList.add('hide');
    document.getElementById('app').classList.add('show');
    document.getElementById('envDisplay').textContent = '环境: ' + envId;

    await loadAll();
  } catch (e) {
    errEl.textContent = '登录失败: ' + (e.message || '用户名或密码错误');
    console.error(e);
  }
}

function doLogout() {
  localStorage.removeItem('cp_envId');
  localStorage.removeItem('cp_username');
  if (app) app.auth().signOut().catch(() => {});
  app = null; envId = ''; uid = '';
  document.getElementById('loginOverlay').classList.remove('hide');
  document.getElementById('app').classList.remove('show');
}

// ===== Load =====
async function loadAll() {
  await Promise.all([loadCategories(), loadDiseaseCategories(), loadBanners(), loadHotSolutions()]);
  await Promise.all([resetProductList(), refreshCategoryProductTotals()]);
  renderAll();
}

function buildProductListRequest(page) {
  const data = {
    type: 'getProducts',
    includeInactive: true,
    page,
    pageSize: productPageSize,
  };
  if (productSearchedKeyword) data.keyword = productSearchedKeyword;
  if (activeCategory !== '全部') data.category = activeCategory;
  return data;
}

async function fetchProductsPage(page) {
  const resp = await app.callFunction({
    name: 'quickstartFunctions',
    data: buildProductListRequest(page),
  });
  const result = resp.result || {};
  if (!result.success) {
    throw new Error(result.errMsg || '加载产品失败');
  }
  const items = Array.isArray(result.data) ? result.data : [];
  return {
    items,
    total: typeof result.total === 'number' ? result.total : items.length,
    page: result.page || page,
    pageSize: result.pageSize || productPageSize,
  };
}

async function attachProductImageUrlsForItems(items) {
  const firstImages = items.map(getProductListImageFileID).filter(Boolean);
  const urls = await getTempFileURLs(firstImages);
  const urlMap = {};
  firstImages.forEach((fileID, idx) => { if (urls[idx]) urlMap[fileID] = urls[idx]; });
  return items.map(p => {
    const imageFileID = getProductListImageFileID(p);
    return { ...p, imageUrl: getDirectProductImageUrl(p) || urlMap[imageFileID] || '' };
  });
}

async function resetProductList() {
  productPage = 1;
  productLoading = true;
  productLoadingMore = false;
  disconnectProductLoadObserver();
  try {
    const { items, total, page } = await fetchProductsPage(1);
    products = await attachProductImageUrlsForItems(items);
    productTotal = total;
    productPage = page;
    productHasMore = products.length < productTotal;
  } catch (e) {
    console.error('resetProductList', e);
    products = [];
    productTotal = 0;
    productHasMore = false;
  } finally {
    productLoading = false;
  }
}

async function loadMoreProducts() {
  if (activeTab !== 'products' || productLoading || productLoadingMore || !productHasMore) return;
  productLoadingMore = true;
  renderContent();
  try {
    const nextPage = productPage + 1;
    const { items, total, page } = await fetchProductsPage(nextPage);
    const withUrls = await attachProductImageUrlsForItems(items);
    products = products.concat(withUrls);
    productTotal = total;
    productPage = page;
    productHasMore = products.length < productTotal;
  } catch (e) {
    console.error('loadMoreProducts', e);
    showToast('加载更多失败');
  } finally {
    productLoadingMore = false;
    renderContent();
  }
}

async function refreshCategoryProductTotals() {
  if (!app) return;
  try {
    const requests = [{ key: '全部', category: undefined }];
    categories.forEach(c => requests.push({ key: c.name, category: c.name }));
    const results = await Promise.all(requests.map(async ({ key, category }) => {
      const data = { type: 'getProducts', includeInactive: true, page: 1, pageSize: 1 };
      if (category) data.category = category;
      const resp = await app.callFunction({ name: 'quickstartFunctions', data });
      const result = resp.result || {};
      return { key, total: result.success ? (result.total || 0) : 0 };
    }));
    categoryProductTotals = {};
    results.forEach(({ key, total }) => { categoryProductTotals[key] = total; });
  } catch (e) {
    console.error('refreshCategoryProductTotals', e);
  }
}

function disconnectProductLoadObserver() {
  if (productLoadObserver) {
    productLoadObserver.disconnect();
    productLoadObserver = null;
  }
}

function setupProductLoadObserver() {
  disconnectProductLoadObserver();
  if (activeTab !== 'products' || !productHasMore || productLoading || productLoadingMore) return;
  const scrollRoot = document.getElementById('contentArea');
  const sentinel = document.getElementById('productLoadSentinel');
  if (!scrollRoot || !sentinel) return;
  productLoadObserver = new IntersectionObserver((entries) => {
    if (entries.some(entry => entry.isIntersecting)) {
      loadMoreProducts();
    }
  }, { root: scrollRoot, rootMargin: '120px', threshold: 0 });
  productLoadObserver.observe(sentinel);
}

function onProductSearchInput(e) {
  productKeyword = e.target.value;
}

async function onProductSearchConfirm() {
  productSearchedKeyword = productKeyword.trim();

  await resetProductList();

async function onClearProductKeyword() {
  productKeyword = '';
  productSearchedKeyword = '';

  await resetProductList();

}

async function loadProducts() {
  await resetProductList();
}

function getProductListImageFileID(product) {
  if (!product) return '';
  if (getDirectProductImageUrl(product)) return '';
  const thumbFileID = product.coverThumb || product.thumbnail || product.thumbImage || product.cover_thumb || '';
  if (thumbFileID && String(thumbFileID).startsWith('cloud://')) return thumbFileID;
  return Array.isArray(product.images) && product.images.length ? product.images[0] : '';
}

function getDirectProductImageUrl(product) {
  if (!product) return '';
  const url = product.coverThumb || product.thumbnail || product.thumbImage || product.image || product.icon || '';
  return url && !String(url).startsWith('cloud://') ? url : '';
}

async function loadCategories() {
  try {
    const resp = await app.callFunction({
      name: 'quickstartFunctions',
      data: { type: 'getCategories', includeInactive: true }

    categories = (resp.result && resp.result.success) ? (resp.result.data || []) : [];

}

async function loadDiseaseCategories() {
  try {
    const resp = await app.callFunction({
      name: 'quickstartFunctions',
      data: { type: 'getDiseaseCategories', includeInactive: true }
    });
    diseaseCategories = (resp.result && resp.result.success) ? (resp.result.data || []) : [];
    await attachDiseaseCategoryIconUrls();
  } catch(e) { console.error('loadDiseaseCategories', e); diseaseCategories = []; }
}

async function attachDiseaseCategoryIconUrls() {
  const fileIDs = diseaseCategories.map(c => c.icon).filter(Boolean);
  const urls = await getTempFileURLs(fileIDs);
  const urlMap = {};
  fileIDs.forEach((fileID, idx) => { if (urls[idx]) urlMap[fileID] = urls[idx]; });
  diseaseCategories = diseaseCategories.map(c => ({ ...c, iconUrl: urlMap[c.icon] || '' }));
}

async function loadBanners() {

    const resp = await app.callFunction({
      name: 'quickstartFunctions',

async function attachBannerImageUrls() {
  const fileIDs = banners.map(b => b.fileID).filter(Boolean);

  const urlMap = {};
  fileIDs.forEach((fileID, idx) => { if (urls[idx]) urlMap[fileID] = urls[idx]; });

async function loadHotSolutions() {
  try {
    const resp = await app.callFunction({
      name: 'quickstartFunctions',
      data: { type: 'getHotSolutions', includeInactive: true }

    hotSolutions = (resp.result && resp.result.success) ? (resp.result.data || []) : [];
    await attachHotSolutionImageUrls();
  } catch(e) { console.error('loadHotSolutions', e); hotSolutions = []; }
}

async function attachHotSolutionImageUrls() {
  const fileIDs = hotSolutions.map(s => (s.coverImage || (Array.isArray(s.images) ? s.images[0] : ''))).filter(Boolean);
  const urls = await getTempFileURLs(fileIDs);
  const urlMap = {};
  fileIDs.forEach((fileID, idx) => { if (urls[idx]) urlMap[fileID] = urls[idx]; });
  hotSolutions = hotSolutions.map(s => {
    const fileID = s.coverImage || (Array.isArray(s.images) ? s.images[0] : '');
    return { ...s, imageUrl: urlMap[fileID] || '' };
  });
}

// ===== Tab Switch =====
function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.tab === tab);
  });
  activeCategory = '全部';
  if (tab !== 'products') disconnectProductLoadObserver();
  renderAll();
}

// ===== Render =====
function renderAll() {
  renderSidebar();
  renderContent();
  const addBtn = document.getElementById('sidebarAddBtn');
  addBtn.textContent = activeTab === 'products' ? '+ 添加产品' : activeTab === 'categories' ? '+ 添加分类' : activeTab === 'diseases' ? '+ 添加病害' : activeTab === 'banners' ? '+ 上传轮播' : '+ 添加方案';
  addBtn.onclick = activeTab === 'products' ? () => openProductForm() : activeTab === 'categories' ? () => openCategoryForm() : activeTab === 'diseases' ? () => openDiseaseCategoryForm() : activeTab === 'banners' ? () => triggerBannerUpload() : () => openHotSolutionForm();
  document.getElementById('productSidebar').style.display = activeTab === 'products' ? '' : 'none';
  document.getElementById('categorySidebar').style.display = activeTab === 'categories' ? '' : 'none';
  document.getElementById('diseaseSidebar').style.display = activeTab === 'diseases' ? '' : 'none';
  document.getElementById('bannerSidebar').style.display = activeTab === 'banners' ? '' : 'none';
  document.getElementById('solutionSidebar').style.display = activeTab === 'solutions' ? '' : 'none';
}

function renderSidebar() {
  if (activeTab === 'products') {
    const allCount = typeof categoryProductTotals['全部'] === 'number'
      ? categoryProductTotals['全部']
      : products.length;

    let html = `<div class="sidebar-item ${activeCategory === '全部' ? 'active' : ''}" onclick="selectCategory('全部')">
      <span>全部产品</span><span class="count">${allCount}</span></div>`;
    categories.forEach(c => {
      const count = typeof categoryProductTotals[c.name] === 'number' ? categoryProductTotals[c.name] : 0;
      html += `<div class="sidebar-item ${activeCategory === c.name ? 'active' : ''}" onclick="selectCategory('${c.name}')">
        <span>${c.iconText || '📦'} ${c.name}</span><span class="count">${count}</span></div>`;
    });
    document.getElementById('productSidebar').innerHTML = html;
  } else {
    if (activeTab === 'solutions') {
      const activeSolutions = hotSolutions.filter(s => s.status !== 'deleted');
      document.getElementById('solutionSidebar').innerHTML = `<div class="sidebar-item active">
        <span>热销方案</span><span class="count">${activeSolutions.length}</span></div>`;
      return;
    }

    if (activeTab === 'banners') {
      const activeBanners = banners.filter(b => b.status !== 'deleted');
      document.getElementById('bannerSidebar').innerHTML = `<div class="sidebar-item active">
        <span>首页轮播</span><span class="count">${activeBanners.length}</span></div>`;
      return;
    }

    if (activeTab === 'diseases') {
      let html = '';
      diseaseCategories.forEach(c => {
        const iconHtml = c.iconUrl
          ? `<img class="cat-icon-thumb" src="${escAttr(c.iconUrl)}" alt="${escAttr(c.name)}">`
          : escHtml(c.iconText || '病');
        html += `<div class="sidebar-item ${activeCategory === c._id ? 'active' : ''}" onclick="selectCategoryItem('${c._id}')">
          <span>${iconHtml} ${escHtml(c.name)}</span><span class="count">排序${c.sort || 0}</span></div>`;
      });
      document.getElementById('diseaseSidebar').innerHTML = html;
      return;
    }

    let html = '';
    categories.forEach(c => {
      html += `<div class="sidebar-item ${activeCategory === c._id ? 'active' : ''}" onclick="selectCategoryItem('${c._id}')">
        <span>${c.iconText || '📦'} ${c.name}</span><span class="count">排序${c.sort || 0}</span></div>`;
    });
    document.getElementById('categorySidebar').innerHTML = html;
  }
}

function getProductCategories(product) {
  const source = Array.isArray(product.categories) && product.categories.length
    ? product.categories
    : product.category
      ? [product.category]
      : [];
  return [...new Set(source.map(item => String(item || '').trim()).filter(Boolean))];
}

function getProductDiseaseCategories(product) {
  const source = Array.isArray(product.diseaseCategories) ? product.diseaseCategories : [];
  return [...new Set(source.map(item => String(item || '').trim()).filter(Boolean))];
}

    .map(input => input.value)
    .filter(Boolean);
}

function getSelectedProductDiseaseCategories() {

}

function buildProductImageItems(product) {
  const images = product && Array.isArray(product.images) ? product.images.filter(Boolean) : [];
  return images.map((fileID, index) => ({
    id: `existing-${Date.now()}-${index}-${productImageItemSeq++}`,
    type: 'existing',
    fileID,
    previewUrl: index === 0 && product && product.imageUrl ? product.imageUrl : '',
  }));
}

function renderProductImageManager() {
  if (!productImageItems.length) {
    return '<div class="product-image-empty">暂无产品图片，请选择图片上传</div>';
  }

  return `<div class="product-image-manager">${productImageItems.map((item, index) => {
    const previewHtml = item.previewUrl
      ? `<img src="${escAttr(item.previewUrl)}" alt="产品图片${index + 1}">`
      : '图';
    return `<div class="product-image-item ${index === 0 ? 'main' : ''}" data-id="${escAttr(item.id)}">
      ${index === 0 ? '<div class="product-image-badge">首图</div>' : ''}
      <div class="product-image-item-preview">${previewHtml}</div>
      <div class="product-image-item-actions">
        <button type="button" onclick="setProductImageAsMain('${item.id}')">设首图</button>
        <button type="button" onclick="moveProductImageItem('${item.id}', -1)">上移</button>
        <button type="button" onclick="moveProductImageItem('${item.id}', 1)">下移</button>
        <button type="button" class="danger" onclick="removeProductImageItem('${item.id}')">删除</button>
      </div>
    </div>`;
  }).join('')}</div>`;
}

function refreshProductImageManager() {
  const manager = document.getElementById('productImageManager');
  if (manager) {
    manager.innerHTML = renderProductImageManager();
  }
}

async function hydrateProductImageItemPreviews() {
  const fileIDs = productImageItems
    .filter(item => item.type === 'existing' && item.fileID && !item.previewUrl)
    .map(item => item.fileID);
  if (!fileIDs.length) return;

  try {
    const urls = await getTempFileURLs(fileIDs);
    let urlIndex = 0;
    productImageItems = productImageItems.map(item => {
      if (item.type !== 'existing' || item.previewUrl) return item;
      const previewUrl = urls[urlIndex++] || '';
      return { ...item, previewUrl };
    });
    refreshProductImageManager();
  } catch (e) {
    console.warn('load product image previews failed', e);
  }
}

function onProductImagesChange(event) {
  const files = Array.from(event.target.files || []);
  files.forEach(file => {
    productImageItems.push({
      id: `new-${Date.now()}-${productImageItemSeq++}`,
      type: 'new',
      file,
      previewUrl: URL.createObjectURL(file),
    });
  });
  event.target.value = '';
  refreshProductImageManager();
}

function removeProductImageItem(id) {
  productImageItems = productImageItems.filter(item => item.id !== id);
  refreshProductImageManager();
}

function moveProductImageItem(id, direction) {
  const index = productImageItems.findIndex(item => item.id === id);
  const nextIndex = index + direction;
  if (index < 0 || nextIndex < 0 || nextIndex >= productImageItems.length) return;
  const nextItems = [...productImageItems];
  const [item] = nextItems.splice(index, 1);
  nextItems.splice(nextIndex, 0, item);
  productImageItems = nextItems;
  refreshProductImageManager();
}

function setProductImageAsMain(id) {
  const index = productImageItems.findIndex(item => item.id === id);
  if (index <= 0) return;
  const nextItems = [...productImageItems];
  const [item] = nextItems.splice(index, 1);
  nextItems.unshift(item);
  productImageItems = nextItems;
  refreshProductImageManager();
}

function sanitizeFileName(name) {
  return String(name || 'product.jpg').replace(/[^\w.\-]+/g, '-');
}

function createProductThumbnailFile(file) {
  return new Promise((resolve, reject) => {
    const image = new Image();
    const objectUrl = URL.createObjectURL(file);
    image.onload = () => {
      URL.revokeObjectURL(objectUrl);
      const maxSide = 480;
      const scale = Math.min(1, maxSide / Math.max(image.width, image.height));
      const canvas = document.createElement('canvas');
      canvas.width = Math.max(1, Math.round(image.width * scale));
      canvas.height = Math.max(1, Math.round(image.height * scale));
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
      canvas.toBlob((blob) => {
        if (!blob) {
          reject(new Error('缩略图生成失败'));
          return;
        }
        const thumbName = sanitizeFileName(file.name).replace(/\.[^.]+$/, '') + '-thumb.jpg';
        resolve(new File([blob], thumbName, { type: 'image/jpeg' }));
      }, 'image/jpeg', 0.78);
    };
    image.onerror = () => {
      URL.revokeObjectURL(objectUrl);
      reject(new Error('图片读取失败'));
    };
    image.src = objectUrl;
  });
}

async function uploadProductImageIfNeeded() {
  if (!productImageItems.length) {
    return { images: [], coverThumb: '' };
  }

  const timestamp = Date.now();
  const uploadedItems = [];
  for (let index = 0; index < productImageItems.length; index += 1) {
    const item = productImageItems[index];
    if (item.type === 'existing') {
      uploadedItems.push(item);
      continue;
    }

    const safeName = sanitizeFileName(item.file && item.file.name ? item.file.name : `product-${index}.jpg`);
    const upload = await app.uploadFile({
      cloudPath: `products/images/${timestamp}-${index}-${safeName}`,
      filePath: item.file,
    });
    const fileID = upload && upload.fileID ? upload.fileID : '';
    if (fileID) {
      uploadedItems.push({ ...item, type: 'existing', fileID });
    }
  }

  const images = uploadedItems.map(item => item.fileID).filter(Boolean);
  if (!images.length) {
    return { images: [], coverThumb: '' };
  }

  const mainItem = uploadedItems[0];
  if (
    mainItem.type === 'existing' &&
    mainItem.fileID === editingProductOriginalMainFileID &&
    editingProductOriginalCoverThumb
  ) {
    return { images, coverThumb: editingProductOriginalCoverThumb };
  }

  let coverThumb = mainItem.fileID;
  if (mainItem.file) {
    let thumbFile;
    try {
      thumbFile = await createProductThumbnailFile(mainItem.file);
    } catch (e) {
      console.warn('create product thumbnail failed, fallback to full image', e);
      thumbFile = mainItem.file;
    }

    const thumbUpload = await app.uploadFile({
      cloudPath: `products/thumbs/${timestamp}-${sanitizeFileName(thumbFile.name || 'main-thumb.jpg')}`,
      filePath: thumbFile,
    });
    coverThumb = thumbUpload && thumbUpload.fileID ? thumbUpload.fileID : mainItem.fileID;
  }

  return {
    images,
    coverThumb,
  };
}

function renderDynamicRows(items, prefix, placeholder1, placeholder2) {
  return items.map((item, i) => {
    if (typeof item === 'string') {
      if (prefix === 'kp') {
        return `<div class="dynamic-row">
        <textarea data-prefix="${prefix}" data-idx="${i}" data-sub="value" placeholder="${placeholder1}">${escHtml(item)}</textarea>
        <div class="rm-btn" onclick="removeDynamicRow(this,'${prefix}')">✕</div></div>`;
      }
      return `<div class="dynamic-row">
        <input value="${escAttr(item)}" data-prefix="${prefix}" data-idx="${i}" data-sub="value" placeholder="${placeholder1}">
        <div class="rm-btn" onclick="removeDynamicRow(this,'${prefix}')">✕</div></div>`;
    }
    return `<div class="dynamic-row">
      <input value="${escAttr(item.name || '')}" data-prefix="${prefix}" data-idx="${i}" data-sub="name" placeholder="${placeholder1 || '名称'}">
      ${placeholder2 ? `<input value="${escAttr(item.concentration || '')}" data-prefix="${prefix}" data-idx="${i}" data-sub="concentration" placeholder="${placeholder2}">` : ''}
      <div class="rm-btn" onclick="removeDynamicRow(this,'${prefix}')">✕</div></div>`;
  }).join('');
}

function addDynamicRow(containerId, prefix, defaultValue) {
  const container = document.getElementById(containerId);
  const idx = container.querySelectorAll('.dynamic-row').length;
  const div = document.createElement('div');
  div.className = 'dynamic-row';
  if (typeof defaultValue === 'object') {
    div.innerHTML = `<input data-prefix="${prefix}" data-idx="${idx}" data-sub="name" placeholder="成分名">
      <input data-prefix="${prefix}" data-idx="${idx}" data-sub="concentration" placeholder="浓度">
      <div class="rm-btn" onclick="removeDynamicRow(this,'${prefix}')">✕</div>`;
  } else {
    div.innerHTML = `<textarea data-prefix="${prefix}" data-idx="${idx}" data-sub="value" placeholder="特点描述"></textarea>
      <div class="rm-btn" onclick="removeDynamicRow(this,'${prefix}')">✕</div>`;
  }
  container.appendChild(div);
}

function removeDynamicRow(btn, prefix) {
  btn.parentElement.remove();
}

function collectDynamicRows(containerId, prefix, isObject) {
  const container = document.getElementById(containerId);
  const rows = container.querySelectorAll('.dynamic-row');
  const result = [];
  rows.forEach(row => {
    const inputs = row.querySelectorAll('input, textarea');
    if (isObject) {
      const name = (inputs[0] && inputs[0].value || '').trim();
      const conc = (inputs[1] && inputs[1].value || '').trim();
      if (name) result.push({ name, concentration: conc });
    } else {
      const val = (inputs[0] && inputs[0].value || '').trim();
      if (val) result.push(val);
    }
  });
  return result;
}

async function saveProduct() {
  const name = document.getElementById('pf_name').value.trim();
  const categoriesValue = getSelectedProductCategories();
  const diseaseCategoriesValue = getSelectedProductDiseaseCategories();
  const category = categoriesValue[0] || '';
  const formulation = document.getElementById('pf_formulation').value.trim();

  if (!name || !category || !formulation) { showToast('请填写必填字段'); return; }

  const ingredients = collectDynamicRows('ingredientsContainer', 'ingredient', true);
  if (ingredients.length === 0) { showToast('请至少填写一个有效成分'); return; }

  let imagePayload = { images: [], coverThumb: '' };
  try {
    imagePayload = await uploadProductImageIfNeeded();
  } catch (e) {
    console.error('upload product image error:', e);
    showToast('图片上传失败: ' + (e.message || ''));
    return;
  }

  const data = {
    name, category,
    categories: categoriesValue,
    diseaseCategories: diseaseCategoriesValue,
    iconText: document.getElementById('pf_iconText').value.trim(),
    formulation,
    manufacturer: document.getElementById('pf_manufacturer').value.trim(),
    specification: document.getElementById('pf_spec').value.trim(),
    active_ingredients: ingredients,
    performance: document.getElementById('pf_performance').value.trim(),
    key_points: collectDynamicRows('kpsContainer', 'kp', false),
    images: imagePayload.images,
    coverThumb: imagePayload.coverThumb,
    status: document.getElementById('pf_status').value,
  };

  console.log('saveProduct', { app: !!app, editingProductId, data });

  try {
    if (editingProductId) {
      console.log('→ adminUpdateProduct');
      await callAdminFunction({ type: 'adminUpdateProduct', id: editingProductId, data });
    } else {
      console.log('→ adminCreateProduct');
      await callAdminFunction({ type: 'adminCreateProduct', data });
    }
    closeModal('productModal');
    await Promise.all([resetProductList(), refreshCategoryProductTotals()]);
    renderAll();
    showToast(editingProductId ? '产品已更新' : '产品已创建');
  } catch(e) { console.error('saveProduct error:', e); showToast('操作失败: ' + (e.message || '')); }
}

async function deleteProduct(id, name) {
  if (!confirm('确认删除产品"' + name + '"？\\n删除后用户将不可见。')) return;
  try {
    await callAdminFunction({ type: 'adminDeleteProduct', id });
    await Promise.all([resetProductList(), refreshCategoryProductTotals()]);

}

async function cleanupLegacyProductFields() {
  if (!confirm('确认清理旧产品数据字段？\\n清理后不影响产品名称、图片、分类、剂型和规格。')) return;

}

}

function setSolutionImageItems(kind, items) {

}

function buildSolutionImageItems(solution, field) {

function renderHotSolutionImageManager(kind) {

function refreshHotSolutionImageManager(kind) {
  const managerId = kind === 'effect' ? 'solutionEffectImageManager' : 'solutionImageManager';
  const manager = document.getElementById(managerId);
  if (manager) manager.innerHTML = renderHotSolutionImageManager(kind);
}

async function hydrateHotSolutionImagePreviews(kind) {
  const items = getSolutionImageItems(kind);
  const fileIDs = items
    .filter(item => item.type === 'existing' && item.fileID && !item.previewUrl)
    .map(item => item.fileID);
  if (!fileIDs.length) return;
  try {
    const urls = await getTempFileURLs(fileIDs);
    let urlIndex = 0;
    setSolutionImageItems(kind, items.map(item => {
      if (item.type !== 'existing' || item.previewUrl) return item;
      return { ...item, previewUrl: urls[urlIndex++] || '' };
    }));
    refreshHotSolutionImageManager(kind);
  } catch (e) {
    console.warn('load solution image previews failed', e);
  }
}

function onHotSolutionImagesChange(event, kind) {
  const files = Array.from(event.target.files || []);
  const items = getSolutionImageItems(kind);
  files.forEach(file => {
    items.push({
      id: `solution-new-${Date.now()}-${solutionImageItemSeq++}`,
      type: 'new',
      file,
      previewUrl: URL.createObjectURL(file),
    });
  });
  event.target.value = '';
  setSolutionImageItems(kind, items);
  refreshHotSolutionImageManager(kind);
}

function removeHotSolutionImageItem(kind, id) {
  setSolutionImageItems(kind, getSolutionImageItems(kind).filter(item => item.id !== id));
  refreshHotSolutionImageManager(kind);
}

function moveHotSolutionImageItem(kind, id, direction) {
  const items = [...getSolutionImageItems(kind)];
  const index = items.findIndex(item => item.id === id);
  const nextIndex = index + direction;
  if (index < 0 || nextIndex < 0 || nextIndex >= items.length) return;
  const [item] = items.splice(index, 1);
  items.splice(nextIndex, 0, item);
  setSolutionImageItems(kind, items);
  refreshHotSolutionImageManager(kind);
}

/**
 * 初始化热销方案产品行拖拽排序事件。
 * @param {HTMLElement|null} container 产品行容器。
 * @returns {void} 无返回值。
 * @example
 * initSolutionProductRowDrag(document.getElementById('solutionProductsContainer'));
 */
function initSolutionProductRowDrag(container) {
  // 容器不存在时直接返回，避免弹窗未渲染导致脚本异常。
  if (!container) return;
  // 动态新增的行需要重新补齐 draggable 属性。
  Array.from(container.querySelectorAll('.solution-product-row')).forEach(row => {
    row.setAttribute('draggable', 'true');
  });
  // 同一个弹窗容器只绑定一次事件，避免重复触发拖拽逻辑。
  if (container.dataset.dragReady === 'true') return;
  container.dataset.dragReady = 'true';
  container.addEventListener('dragstart', handleSolutionProductRowDragStart);
  container.addEventListener('dragover', handleSolutionProductRowDragOver);
  container.addEventListener('dragleave', handleSolutionProductRowDragLeave);
  container.addEventListener('drop', handleSolutionProductRowDrop);
  container.addEventListener('dragend', handleSolutionProductRowDragEnd);
}

/**
 * 根据拖拽结果移动热销方案产品行。
 * @param {HTMLElement|null} container 产品行容器。
 * @param {HTMLElement|null} sourceRow 被拖动的产品行。
 * @param {HTMLElement|null} targetRow 目标产品行。
 * @returns {void} 无返回值。
 * @example
 * moveSolutionProductRowByDrag(container, firstRow, secondRow);
 */
function moveSolutionProductRowByDrag(container, sourceRow, targetRow) {
  // 拖到自身或缺少必要节点时不需要调整顺序。
  if (!container || !sourceRow || !targetRow || sourceRow === targetRow) return;
  const rows = Array.from(container.querySelectorAll('.solution-product-row'));
  const sourceIndex = rows.indexOf(sourceRow);
  const targetIndex = rows.indexOf(targetRow);
  // 找不到行索引通常表示拖拽目标不在当前容器内。
  if (sourceIndex < 0 || targetIndex < 0) return;
  // 向下拖动插到目标后方，向上拖动插到目标前方。
  if (sourceIndex < targetIndex) targetRow.after(sourceRow);
  else targetRow.before(sourceRow);
}

/**
 * 记录当前正在拖动的热销方案产品行。
 * @param {DragEvent} event 拖拽开始事件。
 * @returns {void} 无返回值。
 * @example
 * handleSolutionProductRowDragStart(event);
 */
function handleSolutionProductRowDragStart(event) {
  const row = event.target.closest('.solution-product-row');
  // 只有产品行触发拖拽时才记录状态。
  if (!row) return;
  solutionProductDraggedRow = row;
  row.classList.add('dragging');
  // dataTransfer 存在时设置移动语义，提升浏览器拖拽反馈。
  if (event.dataTransfer) {
    event.dataTransfer.effectAllowed = 'move';
    event.dataTransfer.setData('text/plain', 'solution-product-row');
  }
}

/**
 * 标记拖拽经过的热销方案产品行。
 * @param {DragEvent} event 拖拽经过事件。
 * @returns {void} 无返回值。
 * @example
 * handleSolutionProductRowDragOver(event);
 */
function handleSolutionProductRowDragOver(event) {
  const row = event.target.closest('.solution-product-row');
  // 阻止默认行为后浏览器才允许 drop。
  if (!row || row === solutionProductDraggedRow) return;
  event.preventDefault();
  Array.from(event.currentTarget.querySelectorAll('.solution-product-row')).forEach(item => {
    item.classList.toggle('drag-target', item === row);
  });
}

/**
 * 清除离开行时的拖拽目标状态。
 * @param {DragEvent} event 拖拽离开事件。
 * @returns {void} 无返回值。
 * @example
 * handleSolutionProductRowDragLeave(event);
 */
function handleSolutionProductRowDragLeave(event) {
  const row = event.target.closest('.solution-product-row');
  // 离开当前行时移除高亮，不影响其他行状态。
  if (row) row.classList.remove('drag-target');
}

/**
 * 将热销方案产品行放置到目标位置。
 * @param {DragEvent} event 拖拽释放事件。
 * @returns {void} 无返回值。
 * @example
 * handleSolutionProductRowDrop(event);
 */
function handleSolutionProductRowDrop(event) {
  const targetRow = event.target.closest('.solution-product-row');
  event.preventDefault();
  moveSolutionProductRowByDrag(event.currentTarget, solutionProductDraggedRow, targetRow);
  handleSolutionProductRowDragEnd(event);
}

/**
 * 清理热销方案产品行拖拽状态。
 * @param {DragEvent} event 拖拽结束事件。
 * @returns {void} 无返回值。
 * @example
 * handleSolutionProductRowDragEnd(event);
 */
function handleSolutionProductRowDragEnd(event) {
  Array.from(event.currentTarget.querySelectorAll('.solution-product-row')).forEach(row => {
    row.classList.remove('dragging', 'drag-target');
  });
  solutionProductDraggedRow = null;
}

function collectSolutionProducts() {

      content: row.content.trim(),

    }))

}

async function uploadHotSolutionFiles(items, folder) {
  const timestamp = Date.now();
  const result = [];
  for (let index = 0; index < items.length; index += 1) {
    const item = items[index];
    if (item.type === 'existing') {
      if (item.fileID) result.push(item.fileID);
      continue;
    }
    const safeName = sanitizeFileName(item.file && item.file.name ? item.file.name : `solution-${index}.jpg`);
    const upload = await app.uploadFile({
      cloudPath: `${folder}${timestamp}-${index}-${safeName}`,
      filePath: item.file,
    });
    if (upload && upload.fileID) result.push(upload.fileID);
  }
  return result;
}

// ===== Helpers =====
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.remove('show');
  void el.offsetWidth;
  el.classList.add('show');
}

function statusLabel(s) {
  if (s === 'deleted') return '已删除';
  if (s === 'inactive') return '下架';
  return '上架';
}

function escHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function escAttr(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function fmtDate(d) {
  if (!d) return '';
  const dt = new Date(d);
  return dt.toLocaleDateString('zh-CN') + ' ' + dt.toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'});
}
